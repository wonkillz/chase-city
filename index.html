<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#102a32" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>CHASE CITY V1.1 — 60초의 도주</title>
  </head>
  <body>
    <canvas id="game" aria-label="3D 자동차 추격 게임"></canvas>
    <div id="hud">
      <a class="brand" href="./"
        >CHASE<span>CITY</span><small>THE GETAWAY CLUB</small></a
      >
      <div class="stats">
        <div><small>도주 시간</small><strong id="time">00:00</strong></div>
        <div>
          <small>차량 내구도</small><strong id="health">100%</strong>
          <div class="meter"><i id="health-bar"></i></div>
        </div>
        <button id="pause" aria-label="일시정지">Ⅱ</button>
      </div>
    </div>
    <div class="district">
      <span class="live"></span> DOWNTOWN / 01
      <small>자유롭게 달려. 오래 버텨.</small>
    </div>
    <div id="heat">
      <span>WANTED</span><b>★ ★ ★</b
      ><small id="arrest">경찰을 따돌리세요</small>
      <div class="meter"><i id="arrest-bar"></i></div>
    </div>
    <div id="mission-hud">
      <span>MISSION / 01</span
      ><strong id="mission-progress">생존 0 / 60초</strong>
    </div>
    <div
      id="overlay"
      class="overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="title"
      aria-describedby="message"
    >
      <section>
        <div class="eyebrow" id="eyebrow">MISSION BRIEFING / V1.1</div>
        <h1 id="title">60초의 도주</h1>
        <p id="message">경찰을 피해 60초간 생존하세요.</p>
        <dl id="mission-details">
          <div>
            <dt>목표</dt>
            <dd id="mission-goal">차량을 지키며 60초 생존</dd>
          </div>
          <div>
            <dt>성공 보상</dt>
            <dd id="mission-reward">300 크레딧</dd>
          </div>
        </dl>
        <button id="start" class="primary">START →</button>
        <div class="instructions">
          <span><kbd>←</kbd><kbd>→</kbd> 조향</span
          ><span><kbd>P</kbd> 일시정지</span>
        </div>
        <small class="mobile-hint"
          >모바일: 좌우 버튼을 누르고 있으면 조향합니다</small
        >
      </section>
    </div>
    <div id="touch">
      <div class="steering">
        <button data-control="left" aria-label="왼쪽 조향">←</button
        ><button data-control="right" aria-label="오른쪽 조향">→</button>
      </div>
    </div>
    <div id="speed"><strong>0</strong><span>KM/H</span></div>
    <div id="notice" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
