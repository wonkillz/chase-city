<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#102a32" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>CHASE CITY — Run this town.</title>
  </head>
  <body>
    <canvas id="game" aria-label="3D 자동차 추격 게임"></canvas>
    <div id="hud">
      <a class="brand" href="./"
        >CHASE<span>CITY</span><small>THE GETAWAY CLUB</small></a
      >
      <div class="stats">
        <div><small>도주 시간</small><strong id="time">00:00</strong></div>
        <div>
          <small>차량 내구도</small><strong id="health">100%</strong>
          <div class="meter"><i id="health-bar"></i></div>
        </div>
        <button id="pause" aria-label="일시정지">Ⅱ</button>
      </div>
    </div>
    <div class="district">
      <span class="live"></span> DOWNTOWN / 01
      <small>자유롭게 달려. 오래 버텨.</small>
    </div>
    <div id="heat">
      <span>WANTED</span><b>★ ★ ★</b
      ><small id="arrest">경찰을 따돌리세요</small>
      <div class="meter"><i id="arrest-bar"></i></div>
    </div>
    <div id="overlay" class="overlay">
      <section>
        <div class="eyebrow" id="eyebrow">AN OPEN-WORLD GETAWAY</div>
        <h1 id="title">RUN THIS<br /><em>TOWN.</em></h1>
        <p id="message">
          작은 도시, 끝없는 추격.<br />골목을 가르고 공원을 질러 경찰을
          따돌리세요.
        </p>
        <button id="start" class="primary">도주 시작 <span>↗</span></button>
        <div class="instructions">
          <span><kbd>←</kbd><kbd>→</kbd> 조향</span
          ><span><kbd>SPACE</kbd> 드리프트</span
          ><span><kbd>P</kbd> 일시정지</span>
        </div>
        <small class="mobile-hint"
          >모바일: 좌우 버튼으로 조향 · DRIFT를 함께 누르세요</small
        >
      </section>
      <div class="stamp">
        NO BRAKES.<br />NO BORING DAYS.<span>EST. 2026 / CHASE CITY</span>
      </div>
    </div>
    <div id="touch">
      <div class="steering">
        <button data-control="left" aria-label="왼쪽 조향">←</button
        ><button data-control="right" aria-label="오른쪽 조향">→</button>
      </div>
      <button data-control="drift" class="drift">DRIFT<span>HOLD</span></button>
    </div>
    <div id="speed"><strong>0</strong><span>KM/H</span></div>
    <div id="notice" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
